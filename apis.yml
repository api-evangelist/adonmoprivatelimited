apis:
- aid: adonmoprivatelimited-adonmo-api
  name: Adonmo API
  description: 'Adonmo''s common API for its portals and services, published as an OpenAPI
    3.0.0 document behind a Flasgger Swagger UI at https://api.adonmo.com/apidocs/. The
    publicly served contract exposes two operations against the Acumen ops-portal "spot"
    resource — a paginated list and a delete. All operations require a bearer access
    token; anonymous calls return HTTP 400 with an ``access_token is required`` error
    envelope.'
