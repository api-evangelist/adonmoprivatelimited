aid: adonmoprivatelimited
name: Adonmo Private Limited
description: 'Adonmo Private Limited (AdOnMo) is a Hyderabad, India based ambient digital
  out-of-home (DOOH) advertising company, incorporated in 2016, that operates what it
  describes as India''s largest ambient DOOH network — 66,000+ smart digital screens
  across 27+ Indian cities in residential lobbies, corporate offices, gyms, malls and
  transit environments, reaching a claimed 12M+ daily viewers. The company sells campaigns
  through its AdServe programmatic platform and a self-serve booking portal, and it
  operates the screens themselves with Acumen CMS, its digital-signage content management
  product. Adonmo publishes a small first-party OpenAPI 3.0.0 contract, "Adonmo API",
  from a Flasgger-backed Swagger UI on its production API host.'
