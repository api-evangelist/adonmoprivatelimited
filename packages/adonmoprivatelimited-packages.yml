summary: 'Adonmo publishes real, first-party open-source libraries under the github.com/adonmo
  organization, several of them to public registries. NONE of them is a client SDK for the
  Adonmo API. They are general-purpose engineering libraries — spatiotemporal/mobility data
  handling, Android media and MQTT, Go tooling — released from Adonmo''s platform work. For
  that reason NO SDKs pointer is emitted in apis.yml: sdk_count measures client libraries
  for the provider''s own API, and awarding it here would credit Adonmo with a developer
  surface it does not ship.'
